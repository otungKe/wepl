  # Back Office operations console — a SEPARATE deployment from the customer web
  # app (its own origin, so it can be locked down independently) that talks to
  # the same backend's staff-only /api/ops/* surface. Staff sign in with a
  # corporate email + password (StaffAccount), never the customer OTP flow.
  - type: web
    name: wepl-ops
    runtime: node
    rootDir: backoffice
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node node_modules/next/dist/bin/next start
    healthCheckPath: /login
