    # entry in CELERY_BEAT_SCHEDULE, and execute_due_standing_orders firing
    # twice is a duplicate money movement attempt, not just duplicate work.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-beat.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
