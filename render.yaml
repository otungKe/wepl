  # ══════════════════════════════════════════════════════════════════════════
  # STAGING — a full, isolated mirror of the stack (own DB + Redis) used to
  # validate the two-tier enforcement rollout (ADR-0022) before flipping it in
  # production. The only intentional difference from prod is
  # ACCESS_TIER_ENFORCEMENT="true" on wepl-api-staging. Once the Tier-0
  # experience checks out here, set the same flag on wepl-api.
  # ══════════════════════════════════════════════════════════════════════════
  - type: redis
    name: wepl-redis-staging
    plan: free
    ipAllowList: []

  - type: web
    name: wepl-api-staging
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: wepl-api-staging.onrender.com
      # The pre-#161 fallback that ran Celery inside this process. Declared
      # explicitly (not merely omitted) so a blueprint re-sync actively clears
      # any leftover RUN_EMBEDDED_CELERY=true set directly on the service —
      # the same trick as STAGING_OTP_BYPASS below. Must stay "false" whenever
      # a dedicated beat service is running: two beats double-fire every
      # scheduled task, standing orders included.
      - key: RUN_EMBEDDED_CELERY
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://wepl-api-staging.onrender.com,https://wepl-web-staging.onrender.com
      # Production settings forbid STAGING_OTP_BYPASS while DEBUG=False, so keep it
      # off here too; SMS_BACKEND=console logs the OTP so testers can read it.
      - key: STAGING_OTP_BYPASS
        value: "false"
      # The reason this staging stack exists: enforcement ON, ahead of production.
      - key: ACCESS_TIER_ENFORCEMENT
        value: "true"
      - key: SMS_BACKEND
        value: console
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: WEPL Staging <no-reply@wepl.app>
      - key: ADMIN_PHONE
        sync: false
