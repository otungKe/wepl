      - key: AT_USERNAME
        fromService:
          type: web
          name: wepl-api
          envVarKey: AT_USERNAME
      - key: AT_SENDER_ID
        fromService:
          type: web
          name: wepl-api
          envVarKey: AT_SENDER_ID
      - key: SENTRY_DSN
        fromService:
          type: web
          name: wepl-api
          envVarKey: SENTRY_DSN
      - key: FIREBASE_CREDENTIALS_JSON
        fromService:
          type: web
          name: wepl-api
          envVarKey: FIREBASE_CREDENTIALS_JSON
      - key: USE_S3
        fromService:
