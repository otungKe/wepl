  # ── Async tier, staging (issue #161) — mirrors wepl-worker / wepl-beat ───
  # Sync this stack FIRST and confirm the heartbeats at /api/ops/health/ before
  # touching production. See docs/deploy/worker-tier.md.
  - type: worker
    name: wepl-worker-staging
    runtime: python
    rootDir: backend
    # Render has no free instance type for `type: worker` (free applies to web
    # services only), so this is the first paid service in the blueprint. If a
    # sync rejects the plan name, use the current worker instance type from the
    # Render dashboard — the rest of this service is unaffected.
    plan: starter
    # No collectstatic: this tier serves no HTTP and reads no static manifest.
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-worker.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Every credential below is copied from wepl-api-staging rather than re-declared,
      # so each one is still entered exactly once in the dashboard and the two
      # tiers can never drift apart.
      # SECRET_KEY: signed URLs (apps.files.signing) and the FIELD_ENCRYPTION_KEYS
      # fallback are derived from it — a different key here silently breaks
      # anything the other tier signed or encrypted.
      - key: SECRET_KEY
        fromService:
          type: web
          name: wepl-api-staging
          envVarKey: SECRET_KEY
      # ALLOWED_HOSTS: production.py has no default for it, so settings won't import without it.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: wepl-api-staging
          envVarKey: ALLOWED_HOSTS
      - key: STAGING_OTP_BYPASS
