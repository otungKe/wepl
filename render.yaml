# Postgres lives on Neon (serverless, no 30-day free-tier expiry) — NOT on
# Render. Each API service gets its DATABASE_URL (the Neon connection string,
# incl. sslmode=require) set directly on the service in the dashboard; use a
# separate Neon branch/database for staging so it never touches real data.
services:
  - type: redis
    name: wepl-redis
    plan: free
    ipAllowList: []

  - type: web
    name: wepl-api
    runtime: python
    rootDir: backend
    plan: free
    # Pin the interpreter — Render otherwise defaults to its latest Python (3.14+),
    # which drifts from CI (3.12). Also pinned via backend/.python-version.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Web only: start.sh runs the release steps (migrate + idempotent provisioning)
    # and then Daphne. Celery lives on wepl-worker / wepl-beat below (#161).
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: wepl-api.onrender.com
      # The pre-#161 fallback that ran Celery inside this process. Declared
      # explicitly (not merely omitted) so a blueprint re-sync actively clears
      # any leftover RUN_EMBEDDED_CELERY=true set directly on the service —
      # the same trick as STAGING_OTP_BYPASS below. Must stay "false" whenever
      # a dedicated beat service is running: two beats double-fire every
      # scheduled task, standing orders included.
      - key: RUN_EMBEDDED_CELERY
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://wepl-api.onrender.com,https://wepl-web.onrender.com,https://wepl-ops.onrender.com
      # OTP delivery: 'console' logs the code (visible in logs) instead of sending
      # real SMS. STAGING_OTP_BYPASS is forced off here — production refuses to boot
      # with it enabled (see config/settings/production.py). Setting it explicitly
      # (rather than just omitting it) means a blueprint re-sync actively clears any
      # leftover STAGING_OTP_BYPASS=true that was set directly on the service.
      - key: STAGING_OTP_BYPASS
        value: "false"
      # Two-tier access (ADR-0022). Master switch for enforcing Tier-1 (KYC) on the
      # flag-aware gated surfaces (community create/join + join requests,
      # contribution create, chat, disbursement/amendment requests + votes,
      # welfare claims, standing orders). ENABLED in production — unverified
      # (Tier 0) users are redirected to KYC on these actions. Money-path checks
      # (contribute/advance/STK push) always enforce regardless. Validated on the
      # staging stack first; roll back instantly by setting this to "false".
      - key: ACCESS_TIER_ENFORCEMENT
        value: "true"
      - key: SMS_BACKEND
        value: console
      # Email delivery via Brevo. Render's free tier blocks outbound SMTP, so we
      # send over Brevo's HTTP API (port 443): set BREVO_API_KEY (secret) from
      # Brevo → SMTP & API → API Keys. The SMTP_* vars below are an unused
      # fallback kept for non-blocked hosts. DEFAULT_FROM_EMAIL must be a
      # Brevo-verified sender/domain.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: WEPL <no-reply@wepl.app>
      # Platform admin bootstrap (free tier has no shell). start.sh runs
      # ensure_superuser on every deploy and creates/updates this account.
      # Set both on the service; ADMIN_PHONE is the /admin/ login.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Back Office bootstrap super admin (StaffAccount) — corporate email +
      # password, provisioned on deploy by create_ops_admin. This is the seed
      # operator who then provisions the rest from the console/admin.
      - key: OPS_ADMIN_EMAIL
        sync: false
      - key: OPS_ADMIN_PASSWORD
        sync: false
      # Neon Postgres connection string (postgresql://…?sslmode=require…).
      # Set in the dashboard — never committed. Use the DIRECT (non-pooled)
      # endpoint: Django holds persistent connections (CONN_MAX_AGE) and the
      # process count here is small.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: wepl-redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: redis
          name: wepl-redis
          property: connectionString
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      # Must be the full STK callback route — Daraja POSTs the result here.
      # A bare /api/mpesa/ 404s, so the STK request never finalises.
      - key: MPESA_CALLBACK_URL
        value: https://wepl-api.onrender.com/api/mpesa/stk/callback/
      # B2C (payout) result/timeout endpoints. Initiator name + security
      # credential are secrets — set MPESA_B2C_INITIATOR_NAME and
      # MPESA_B2C_SECURITY_CREDENTIAL in the dashboard before testing payouts.
      - key: MPESA_B2C_RESULT_URL
        value: https://wepl-api.onrender.com/api/mpesa/b2c/result/
      - key: MPESA_B2C_TIMEOUT_URL
        value: https://wepl-api.onrender.com/api/mpesa/b2c/timeout/
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # ── Durable media storage (Cloudflare R2, S3-compatible) ────────────────
      # ENABLED: KYC/profile uploads (the verification case evidence store) live
      # in the private R2 bucket and are served via signed URLs — they survive
      # redeploys. The four creds below are set directly on the service
      # (sync: false). See production.py. Production REFUSES TO BOOT with
      # USE_S3=false unless ALLOW_EPHEMERAL_MEDIA=true (apps/core/deploy_checks.py),
      # and with USE_S3=true but missing creds it fails fast with a clear error.
      - key: USE_S3
        value: "true"
      # Escape hatch for deployments that genuinely store no user media/KYC.
      # Leave "false" for any deployment that accepts uploads.
      - key: ALLOW_EPHEMERAL_MEDIA
        value: "false"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # ── Async tier (issue #161 / P0-01) ──────────────────────────────────────
  # Celery used to run inside wepl-api's process: a notification fan-out or the
  # hourly reconciliation competed with HTTP requests for the same CPU, and every
  # web restart killed in-flight tasks. On their own services the queue isolation
  # declared in CELERY_TASK_ROUTES (default / notifications / payments /
  # financial) finally buys something: this tier scales on queue depth, the web
  # tier on request rate. Liveness is the DB-backed WorkerHeartbeat, visible at
  # /api/ops/health/ and via `manage.py check_workers`.
  # Rollout order and the dashboard steps: docs/deploy/worker-tier.md.
  - type: worker
    name: wepl-worker
    runtime: python
    rootDir: backend
    # Render has no free instance type for `type: worker` (free applies to web
    # services only), so this is the first paid service in the blueprint. If a
    # sync rejects the plan name, use the current worker instance type from the
    # Render dashboard — the rest of this service is unaffected.
    plan: starter
    # No collectstatic: this tier serves no HTTP and reads no static manifest.
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-worker.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Every credential below is copied from wepl-api rather than re-declared,
      # so each one is still entered exactly once in the dashboard and the two
      # tiers can never drift apart.
      # SECRET_KEY: signed URLs (apps.files.signing) and the FIELD_ENCRYPTION_KEYS
      # fallback are derived from it — a different key here silently breaks
      # anything the other tier signed or encrypted.
      - key: SECRET_KEY
        fromService:
          type: web
          name: wepl-api
          envVarKey: SECRET_KEY
      # ALLOWED_HOSTS: production.py has no default for it, so settings won't import without it.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: wepl-api
          envVarKey: ALLOWED_HOSTS
      - key: STAGING_OTP_BYPASS
        fromService:
          type: web
          name: wepl-api
          envVarKey: STAGING_OTP_BYPASS
      - key: ACCESS_TIER_ENFORCEMENT
        fromService:
          type: web
          name: wepl-api
          envVarKey: ACCESS_TIER_ENFORCEMENT
      - key: SMS_BACKEND
        fromService:
          type: web
          name: wepl-api
          envVarKey: SMS_BACKEND
      - key: BREVO_API_KEY
        fromService:
          type: web
          name: wepl-api
          envVarKey: BREVO_API_KEY
      - key: EMAIL_BACKEND
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_BACKEND
      - key: EMAIL_HOST
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_PORT
      - key: EMAIL_USE_TLS
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_USE_TLS
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: wepl-api
          envVarKey: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: wepl-api
          envVarKey: DEFAULT_FROM_EMAIL
      - key: DATABASE_URL
        fromService:
          type: web
          name: wepl-api
          envVarKey: DATABASE_URL
      - key: MPESA_CONSUMER_KEY
        fromService:
          type: web
          name: wepl-api
          envVarKey: MPESA_CONSUMER_KEY
      - key: MPESA_CONSUMER_SECRET
        fromService:
          type: web
          name: wepl-api
          envVarKey: MPESA_CONSUMER_SECRET
      - key: MPESA_SHORTCODE
        fromService:
          type: web
          name: wepl-api
          envVarKey: MPESA_SHORTCODE
      - key: MPESA_PASSKEY
        fromService:
          type: web
