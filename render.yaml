      - key: MPESA_CALLBACK_URL
        fromService:
          type: web
          name: wepl-api
          envVarKey: MPESA_CALLBACK_URL
      - key: MPESA_B2C_RESULT_URL
        fromService:
          type: web
          name: wepl-api
