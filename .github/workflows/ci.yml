name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (Postgres + Redis)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wepl
          POSTGRES_USER: wepl
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wepl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-test-secret-key
      DB_NAME: wepl
      DB_USER: wepl
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Guard — legacy ledger & mutable balance caches stay deleted (P0-07)
        run: |
          # Money moves only via post_journal(); balances are ledger-derived.
          pattern='LedgerEntry|write_ledger_entry|write_reversal_credit|ledger\.queries'
          pattern="$pattern|ContributionAccount|ContributionBalance"
          pattern="$pattern|current_amount[[:space:]]*=[[:space:]]*F\(|total_pool[[:space:]]*=[[:space:]]*F\(|balance[[:space:]]*=[[:space:]]*F\('balance'\)"
          # ShareHolding kept the same kind of counter until it was derived from
          # the shares sub-ledger; it drifted precisely because this guard named
          # symbols rather than the rule and never looked at it.
          pattern="$pattern|shares_count[[:space:]]*=[[:space:]]*F\(|total_contributed[[:space:]]*=[[:space:]]*F\("
          # The legacy contribution-coupled payments.Payment (a money record kept
          # OUTSIDE the ledger, pre-ADR-0003 precision) and its serializer/view were
          # removed (#165) — don't let them come back. Word boundaries keep this off
          # the legitimate PaymentIntent (ADR-0014) and ContributionPaymentSerializer.
          pattern="$pattern|class Payment\(|\bPaymentSerializer\b|\bContributionPaymentsView\b"
          if grep -rEn "$pattern" apps --include=*.py \
               | grep -vE "/migrations/|/tests\.py|/tests_"; then
            echo "::error::Legacy ledger / mutable balance cache / payments.Payment reintroduced — money moves only via post_journal() and balances are ledger-derived; external payments use payments.PaymentIntent (ADR-0014)."
            exit 1
          fi

      - name: Guard — no new mutable money counters (ADR-0002)
        run: |
          # The guard above is a denylist of names that have already gone wrong.
          # Naming shares_count and total_contributed closes the instance #200
          # found; it does not close the class. The next counter will be called
          # something else, and the guard will not be looking for it.
          #
          # The rule is that a money or quantity figure is DERIVED from immutable
          # journal lines. A field incremented with F() is a second copy of
          # something the ledger already knows, and a second copy drifts: every
          # write site has to get idempotency, ordering and failure right on its
          # own. Of the three counters that existed when the audit ran, two had
          # the same replay defect — the shares holding (#200) and
          # EmergencyAdvance.amount_repaid (#201). Both are derived now.
          #
          # So match the shape, not the names, and allow only what is declared
          # below. Adding a line to the allowlist is the point — it takes a
          # reviewer, and it keeps the remaining debt countable.
          #
          # The allowlist is one line. AccountBalance is the sanctioned
          # projection of the journal and post_journal is its only writer
          # (ADR-0002). Every other mutable money counter in this codebase has
          # now been derived instead: share holdings in #202, the advance
          # repayment counter here. If this list grows, something has gone back.
          counter='[a-z_]*(amount|balance|total|pool|contributed|repaid|shares|principal|interest|fee)[a-z_]*'
          allowed='^apps/ledger/posting\.py:[0-9]+:[[:space:]]*(debit|credit)_total=F\('
          hits=$(grep -rEn "$counter[[:space:]]*=[[:space:]]*F\(" apps --include=*.py \
                   | grep -vE "/migrations/|/tests\.py|/tests_" \
                   | grep -vE "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A mutable money counter was added. Balances are derived from journal lines (ADR-0002) — read them back via apps.ledger.balances instead. If the figure genuinely cannot be derived, add it to the allowlist in this step with a reason."
            exit 1
          fi

      - name: Guard — the ledger never imports a payment rail (#159, Rule 1 / P-18)
        run: |
          # The ledger is the book of record: it posts journals and knows nothing
          # of M-Pesa. Payout orchestration lives in apps/payments (ADR-0032).
          if grep -rEn "apps\.mpesa" apps/ledger --include=*.py \
               | grep -vE "/migrations/|/tests\.py|/tests_"; then
            echo "::error::apps/ledger imports apps.mpesa — the ledger must not drive a payment rail; orchestrate payouts in apps/payments behind the PaymentProvider port (#159, ADR-0032)."
            exit 1
          fi

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run test suite (with coverage)
        run: coverage run --source=apps manage.py test --noinput -v2

      # Gate the double-entry posting engine. The threshold ratchets up as Phase 0
      # removes legacy code (writer/queries/tasks) and rewrites money paths onto
      # post_journal() — at which point models.py and more join the gated set.
      - name: Enforce ledger-core coverage (>=90%)
        run: >-
          coverage report
          --include="apps/ledger/posting.py,apps/ledger/balances.py,apps/ledger/coa.py,apps/ledger/money.py,apps/ledger/posting_map.py"
          --fail-under=90

      # Gate the authorization policy layer (ADR-0009), session/token revocation
      # (ADR-0010) and tenant-isolation seams (ADR-0008). These are small,
      # security-critical modules; like the ledger core they must stay well-tested.
      - name: Enforce authz / session / isolation / audit / observability / notif / reminders coverage (>=90%)
        run: >-
          coverage report
          --include="apps/core/policy.py,apps/communities/policies.py,apps/contributions/policies.py,apps/conversations/policies.py,apps/conversations/groups.py,apps/users/sessions.py,apps/users/token_views.py,apps/tenants/celery_hooks.py,apps/tenants/guards.py,apps/audit/services.py,apps/audit/models.py,apps/core/observability.py,apps/notifications/channels.py,apps/notifications/deadletter.py,apps/reminders/tasks.py,apps/payments/services.py,apps/payments/reconciliation.py,apps/files/services.py,apps/files/signing.py,apps/files/views.py,apps/search/services.py,apps/search/views.py"
          --fail-under=90

      - name: Full coverage report (informational)
        if: always()
        run: coverage report
