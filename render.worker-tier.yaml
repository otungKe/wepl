# The async tier: Celery worker + beat as their own services.
#
# THIS FILE IS NOT SYNCED. Render only reads render.yaml, and these four
# services need a PAID instance type — Render has no free plan for
# `type: worker`. Keeping them here means a blueprint sync for any unrelated
# reason cannot try to create a paid service, and cannot flip production's
# async tier out from under the free-tier layout that is actually running.
#
# Until this is adopted, Celery still runs inside the web process, the way it
# always has: RUN_EMBEDDED_CELERY defaults to "true" and render.yaml declares it
# "true" on both API services. See #161 and docs/deploy/worker-tier.md.
#
# ── Adopting it (the cutover, one PR) ──────────────────────────────────────
#   1. Paste the service entries below into render.yaml.
#   2. Flip RUN_EMBEDDED_CELERY to "false" on wepl-api and wepl-api-staging.
#   3. Sync the blueprint, then set the two MPESA_B2C_* secrets on the worker.
#
# Steps 1 and 2 are one edit on purpose: worker services present while the web
# service still runs its own beat is two schedulers, and the web service with
# no embedded Celery and no worker services is no async processing at all.
# apps/core/tests_deploy_topology.py fails the build on either half-state, so
# the cutover cannot land half-done.
#
# Everything else about these services — queue coverage, the single beat
# instance, the copied SECRET_KEY — is asserted from this file by that same
# test module, so it is guarded while it waits here.
services:

  # ── Async tier (issue #161 / P0-01) ──────────────────────────────────────
  # Celery used to run inside wepl-api's process: a notification fan-out or the
  # hourly reconciliation competed with HTTP requests for the same CPU, and every
  # web restart killed in-flight tasks. On their own services the queue isolation
  # declared in CELERY_TASK_ROUTES (default / notifications / payments /
  # financial) finally buys something: this tier scales on queue depth, the web
  # tier on request rate. Liveness is the DB-backed WorkerHeartbeat, visible at
  # /api/ops/health/ and via `manage.py check_workers`.
  # Rollout order and the dashboard steps: docs/deploy/worker-tier.md.
  - type: worker
    name: wepl-worker
    runtime: python
    rootDir: backend
    # Render has no free instance type for `type: worker` (free applies to web
    # services only), so this is the first paid service in the blueprint. If a
    # sync rejects the plan name, use the current worker instance type from the
    # Render dashboard — the rest of this service is unaffected.
    plan: starter
    # No collectstatic: this tier serves no HTTP and reads no static manifest.
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-worker.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Every credential below is copied from wepl-api rather than re-declared,
      # so each one is still entered exactly once in the dashboard and the two
      # tiers can never drift apart.
      # SECRET_KEY: signed URLs (apps.files.signing) and the FIELD_ENCRYPTION_KEYS
      # fallback are derived from it — a different key here silently breaks
      # anything the other tier signed or encrypted.
      - key: SECRET_KEY
        fromService:
          type: web
          name: wepl-api
          envVarKey: SECRET_KEY
      # ALLOWED_HOSTS: production.py has no default for it, so settings won't import without it.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: wepl-api
          envVarKey: ALLOWED_HOSTS
      - key: STAGING_OTP_BYPASS
        fromService:
          type: web
          name: wepl-api
          envVarKey: STAGING_OTP_BYPASS
